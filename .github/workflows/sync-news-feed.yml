name: Sync news feed

on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-news-feed
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/sync-feed.mjs
      - name: Commit updated feed
        run: |
          if git diff --quiet -- public/feed.json; then
            echo "Feed is unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/feed.json
          git commit -m "chore: sync daily article feed" -m "Co-authored-by: Copilot App <223556219+Copilot@users.noreply.github.com>"
          git push
